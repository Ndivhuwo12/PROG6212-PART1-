name: .NET Build & CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest   # Windows required for net8.0-windows target

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore CybersecurityChatbot/CybersecurityChatbot.csproj

      - name: Build (Release)
        run: dotnet build CybersecurityChatbot/CybersecurityChatbot.csproj --configuration Release --no-restore

      - name: Publish artefact
        uses: actions/upload-artifact@v4
        with:
          name: CybersecurityChatbot
          path: CybersecurityChatbot/bin/Release/
